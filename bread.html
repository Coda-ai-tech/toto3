<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Manipulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .item {
            margin: 10px 0;
        }
        .item a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>
    <div id="result"></div> <!-- Container for displaying results -->

    <script>
        async function loadJSON() {
            try {
                const response = await fetch('path/to/your/json/file.json'); // Update with your JSON file path
                const data = await response.json();

                // Assuming the structure of your JSON contains an array
                const modifiedData = data.map((item, index) => {
                    if (index >= 22 && index <= 35) { // Lines 23-36 (0-indexed)
                        return {
                            label: item.label,
                            link: {
                                type: "routeLink",
                                href: `/en/product/neorest/${item.label}` // Use item.label for href
                            }
                        };
                    }
                    return null; // Return null for unchanged items
                }).filter(item => item !== null); // Remove null entries

                displayResults(modifiedData); // Call function to display results
            } catch (error) {
                console.error("Error loading JSON:", error);
            }
        }

        function displayResults(data) {
            const resultContainer = document.getElementById('result');
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<strong>${item.label}</strong>: <a href="${item.link.href}">${item.link.href}</a>`;
                resultContainer.appendChild(div);
            });
        }

        loadJSON();
    </script>
</body>
</html>
